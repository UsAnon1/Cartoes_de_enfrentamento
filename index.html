<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartões de enfrentamento</title>
<style>
:root{--bg:#f4f1ec;--fg:#2b2a33;--muted:#7a7785;--accent:#6c5ce7;--surface:#fff;--line:rgba(43,42,51,.15)}
@media (prefers-color-scheme:dark){:root{--bg:#17161c;--fg:#f1eff7;--muted:#9a97a8;--accent:#8f82ff;--surface:#24232c;--line:rgba(241,239,247,.18)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}
button,label{font:inherit;cursor:pointer}
.hidden{display:none!important}
.app{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;padding:20px 20px 0}
header h1{font-size:22px;margin:4px 0 0;text-align:center}
main{flex:1;display:flex;flex-direction:column;padding-bottom:96px}
section{flex:1;flex-direction:column;display:flex}
.sub{color:var(--muted);font-size:14px;margin:8px 0 16px;text-align:center}
.empty{text-align:center;color:var(--muted);margin:30% 10px 0}

/* abas */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:12px 4px 10px;font-size:13px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--accent);font-weight:600}

/* pilha de cartões */
.stack{position:relative;flex:1;min-height:420px;margin:18px 0 12px;touch-action:pan-y}
.card{position:absolute;inset:0;border-radius:24px;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;font-size:26px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;user-select:none;cursor:grab;transition:transform .35s ease,opacity .35s ease}
.card.drag{transition:none;cursor:grabbing}
.card img,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.counter{color:var(--muted);font-size:13px;text-align:center}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:4px}

/* botões */
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;margin-bottom:10px;text-align:center}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.fab{position:fixed;bottom:84px;right:max(20px,calc(50% - 200px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:6}

/* biblioteca */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.item-bib{display:flex;flex-direction:column;gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:14px;line-height:1.3;background:var(--surface);border:1px solid var(--line)}
.thumb.quebrada{color:var(--muted);font-size:12px}
.item-bib .tit{font-size:13px;text-align:center;color:var(--muted);min-height:16px}
.item-bib button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:10px;padding:9px;font-weight:600}
.item-bib button.ok{background:var(--accent);color:#fff}

/* gerenciar */
.linha{display:flex;gap:12px;align-items:center;padding:10px;background:var(--surface);border-radius:14px;margin-bottom:10px;border:1px solid var(--line)}
.linha .thumb{width:44px;aspect-ratio:3/4;flex:none;border-radius:8px;padding:0;font-size:0;border:0}
.linha .t{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha button{border:0;background:none;font-size:18px;padding:6px}

/* janela */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:24px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 16px;font-size:20px}
textarea,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;margin-bottom:12px;font-family:inherit}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.row input[type=color]{width:56px;height:44px;padding:2px;border:0;background:none}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <header><h1>Cartões de enfrentamento</h1></header>

  <main>
    <section id="tab-cartoes">
      <div class="stack" id="stack"></div>
      <div class="counter" id="counter"></div>
      <div class="hint">Arraste o cartão ou use as setas ← →</div>
    </section>

    <section id="tab-biblioteca" class="hidden">
      <p class="sub">Cartões prontos. Toque em “Adicionar” para levar para os seus.</p>
      <div class="grade" id="grade"></div>
    </section>

    <section id="tab-gerenciar" class="hidden">
      <p class="sub">Edite ou exclua os seus cartões.</p>
      <div id="lista"></div>
    </section>
  </main>

  <nav>
    <button data-tab="cartoes" class="on"><span>🃏</span>Meus cartões</button>
    <button data-tab="biblioteca"><span>📚</span>Biblioteca</button>
    <button data-tab="gerenciar"><span>⚙️</span>Gerenciar</button>
  </nav>

  <input type="file" id="arq" accept="image/*" class="sr">
  <button class="fab" id="fab" aria-label="Adicionar cartão">+</button>
  <div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
</div>

<script src="biblioteca.js"></script>
<script>
var KEY='reflexo_v1';
var padrao=[
 {id:1,tipo:'texto',texto:'Eu não preciso ter todas as respostas hoje.',bg:'#6c5ce7',cor:'#ffffff',fonte:'Georgia, serif'},
 {id:2,tipo:'texto',texto:'O que eu posso fazer agora, com o que tenho?',bg:'#00b894',cor:'#ffffff',fonte:'system-ui, sans-serif'},
 {id:3,tipo:'texto',texto:'Respirar também é progresso.',bg:'#fdcb6e',cor:'#2b2a33',fonte:'Georgia, serif'},
 {id:4,tipo:'texto',texto:'Sou gentil comigo como sou com quem amo.',bg:'#e17055',cor:'#ffffff',fonte:'system-ui, sans-serif'}
];
var fila;
try{fila=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){fila=null}
if(!Array.isArray(fila))fila=padrao;
var lib=(typeof BIBLIOTECA!=='undefined'&&Array.isArray(BIBLIOTECA))?BIBLIOTECA:[];
var nextId=Date.now(), animando=false, aba='cartoes';
var $=function(s){return document.querySelector(s)};
var stack=$('#stack');

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function salvar(){
  try{localStorage.setItem(KEY,JSON.stringify(fila))}
  catch(e){alert('Armazenamento do navegador cheio. Exclua algumas imagens importadas.')}
}
function chave(it){return it.arquivo||it.texto}
function visual(r,cls){ // desenha um cartão (texto ou imagem)
  var d=el('div',cls);
  if(r.tipo==='imagem'){
    var i=el('img');i.alt='';i.src=r.url;
    i.onerror=function(){d.classList.add('quebrada');i.remove();d.textContent='Imagem não encontrada: '+r.url};
    d.appendChild(i);
  }else{d.textContent=r.texto;d.style.background=r.bg;d.style.color=r.cor;d.style.fontFamily=r.fonte}
  return d;
}
function tudo(){render();renderBib();renderLista()}

/* ---------- abas ---------- */
function ir(nome){
  aba=nome;
  ['cartoes','biblioteca','gerenciar'].forEach(function(n){$('#tab-'+n).classList.toggle('hidden',n!==nome)});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===nome)});
  $('#fab').classList.toggle('hidden',nome!=='cartoes');
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){ir(b.dataset.tab)}});

/* ---------- pilha com swipe e loop ---------- */
function render(){
  stack.innerHTML='';animando=false;
  if(!fila.length){stack.appendChild(el('p','empty','Nenhum cartão ainda. Toque em + para criar ou visite a Biblioteca.'));$('#counter').textContent='';return}
  fila.slice(0,3).reverse().forEach(function(r,i,arr){
    var pos=arr.length-1-i,d=visual(r,'card');
    d.style.transform='translateY('+pos*14+'px) scale('+(1-pos*0.05)+')';d.style.zIndex=10-pos;
    stack.appendChild(d);
  });
  $('#counter').textContent=fila.length+(fila.length===1?' cartão':' cartões')+' em loop';
  bind(stack.lastChild);
}
function relayout(){
  [].slice.call(stack.children).reverse().forEach(function(c,pos){
    c.style.transform='translateY('+pos*14+'px) scale('+(1-pos*0.05)+')';
  });
}
function sair(elc,dir){
  if(animando||!fila.length)return;animando=true;
  elc.classList.remove('drag');
  elc.style.transform='translateX('+dir*600+'px) rotate('+dir*25+'deg)';elc.style.opacity=0;
  fila.push(fila.shift());salvar(); // o cartão do topo vai para o final da fila
  setTimeout(render,300);
}
function bind(c){
  var sx=0,dx=0,on=false;
  c.addEventListener('pointerdown',function(e){if(animando)return;on=true;sx=e.clientX;c.classList.add('drag');c.setPointerCapture(e.pointerId)});
  c.addEventListener('pointermove',function(e){
    if(!on)return;dx=e.clientX-sx;
    c.style.transform='translateX('+dx+'px) rotate('+dx/18+'deg)';
    var p=Math.min(Math.abs(dx)/150,1),prev=c.previousSibling;
    if(prev)prev.style.transform='translateY('+(14-14*p)+'px) scale('+(0.95+0.05*p)+')';
  });
  function fim(){
    if(!on)return;on=false;
    if(Math.abs(dx)>90)sair(c,dx>0?1:-1);
    else{c.classList.remove('drag');c.style.transform='translateY(0) scale(1)';relayout()}
    dx=0;
  }
  c.addEventListener('pointerup',fim);c.addEventListener('pointercancel',fim);
}
document.addEventListener('keydown',function(e){
  if(aba!=='cartoes'||!$('#modal').classList.contains('hidden'))return;
  var t=stack.lastChild;if(!t||!t.classList.contains('card'))return;
  if(e.key==='ArrowRight')sair(t,1);
  if(e.key==='ArrowLeft')sair(t,-1);
});

/* ---------- biblioteca ---------- */
function renderBib(){
  var g=$('#grade');g.innerHTML='';
  if(!lib.length){
    var p=el('p','empty','A biblioteca ainda está vazia.');p.style.gridColumn='1 / -1';g.appendChild(p);return;
  }
  lib.forEach(function(it){
    var k=chave(it),box=el('div','item-bib');
    var r=it.arquivo?{tipo:'imagem',url:it.arquivo}:{tipo:'texto',texto:it.texto,bg:it.bg||'#6c5ce7',cor:it.cor||'#ffffff',fonte:it.fonte||'system-ui, sans-serif'};
    box.appendChild(visual(r,'thumb'));
    box.appendChild(el('div','tit',it.titulo||''));
    var tem=fila.some(function(x){return x.origem===k});
    var b=el('button',tem?'ok':'',tem?'✓ Adicionado':'Adicionar');
    b.onclick=function(){
      if(tem)fila=fila.filter(function(x){return x.origem!==k});
      else{var n=JSON.parse(JSON.stringify(r));n.id=nextId++;n.origem=k;fila.unshift(n)}
      salvar();tudo();
    };
    box.appendChild(b);g.appendChild(box);
  });
}

/* ---------- gerenciar ---------- */
function renderLista(){
  var L=$('#lista');L.innerHTML='';
  if(!fila.length){L.appendChild(el('p','empty','Nada por aqui.'));return}
  fila.forEach(function(r){
    var linha=el('div','linha');
    linha.appendChild(visual(r,'thumb'));
    linha.appendChild(el('span','t',r.tipo==='imagem'?(r.origem?'Imagem da biblioteca':'Imagem importada'):r.texto));
    if(r.tipo==='texto'&&!r.origem){var e=el('button','','✏️');e.setAttribute('aria-label','Editar');e.onclick=function(){editor(r.id)};linha.appendChild(e)}
    var x=el('button','','🗑️');x.setAttribute('aria-label','Excluir');
    x.onclick=function(){fila=fila.filter(function(y){return y.id!==r.id});salvar();tudo()};
    linha.appendChild(x);L.appendChild(linha);
  });
}

/* ---------- janelas: novo cartão, editor, importar ---------- */
function abrir(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden')}
function fechar(){$('#modal').classList.add('hidden')}
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal')fechar()});

$('#fab').onclick=function(){
  abrir('<h2>Adicionar cartão</h2><button class="btn" id="mTxt">✍️ Escrever nova frase</button><label class="btn sec" for="arq">🖼️ Importar imagem</label>');
  $('#mTxt').onclick=function(){editor()};
};
$('#arq').addEventListener('change',function(){var f=this.files&&this.files[0];this.value='';importar(f)});

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function editor(id){
  var r=id?fila.find(function(x){return x.id===id}):null;
  abrir('<h2>'+(r?'Editar frase':'Nova frase')+'</h2><textarea id="eT" rows="4" placeholder="Digite sua frase...">'+esc(r?r.texto:'')+'</textarea>'+
  '<div class="row"><label>Fundo</label><input type="color" id="eB" value="'+(r?r.bg:'#6c5ce7')+'"><label>Texto</label><input type="color" id="eC" value="'+(r?r.cor:'#ffffff')+'"></div>'+
  '<select id="eF"><option value="system-ui, sans-serif">Sans-serif</option><option value="Georgia, serif">Serifada</option><option value="\'Courier New\', monospace">Máquina de escrever</option><option value="cursive">Manuscrita</option></select>'+
  '<button class="btn" id="eS">Salvar</button>');
  if(r)$('#eF').value=r.fonte;
  $('#eS').onclick=function(){
    var t=$('#eT').value.trim();if(!t)return;
    if(r){r.texto=t;r.bg=$('#eB').value;r.cor=$('#eC').value;r.fonte=$('#eF').value}
    else fila.unshift({id:nextId++,tipo:'texto',texto:t,bg:$('#eB').value,cor:$('#eC').value,fonte:$('#eF').value});
    salvar();fechar();tudo();ir('cartoes');
  };
}
function importar(f){
  if(!f)return;
  var url=URL.createObjectURL(f),img=new Image();
  img.onload=function(){
    try{
      var m=1000,sc=Math.min(1,m/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      fila.unshift({id:nextId++,tipo:'imagem',url:c.toDataURL('image/jpeg',0.82)});
      URL.revokeObjectURL(url);salvar();fechar();tudo();ir('cartoes');
    }catch(e){alert('Erro ao processar a imagem: '+e.message)}
  };
  img.onerror=function(){alert('Não consegui ler essa imagem. Tente um arquivo JPG ou PNG.')};
  img.src=url;
}

tudo();
</script>
</body>
</html>
